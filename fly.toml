# Fly.io app config. See STATE.md / README.md "Deploying" for the
# one-time setup (account, Postgres, Redis) — those need an authenticated
# `flyctl` session, which is the author's to run, not the agent's.
app = "prism-storefront"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  APP_ENV = "production"
  APP_PORT = "8000"
