[project]
name = "prism"
version = "0.1.0"
description = "PRISM — an instrumented storefront that infers browsing interest in real time"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "pillow>=10.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.importlinter]
root_packages = ["catalog", "server", "sim", "eval"]

[[tool.importlinter.contracts]]
name = "features has no upward imports"
type = "forbidden"
source_modules = ["server.features"]
forbidden_modules = ["server.ingest", "server.models", "server.recommender"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catalog*", "server*", "sim*", "eval*", "sdk*"]
